<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Laboratorul 5</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div id="pagina">

        <div id="stanga">
            <h3>Adauga student</h3>
            <input type="text" id="inputNume" placeholder="Nume"> <br>
            <input type="text" id="inputGrupa" placeholder="Grupa"> <br>
            <input type="number" id="inputVarsta" placeholder="Varsta"> <br>
            <input type="text" id="inputAvatar" placeholder="link Avatar"> <br>
            <button id="btnAdauga">Adauga student</button>
            <p id="eroare"></p>

            <p id="numarStudenti"></p>

            <h3>Control</h3>

            <p>justify-content:</p>
            <button id="btnStart">flex-start</button>
            <button id="btnCenter">center</button>
            <button id="btnEnd">flex-end</button>
            <button id="btnBetween">space-between</button>
            <button id="btnAround">space-around</button>
            <button id="btnEvenly">space-evenly</button>

            <p>align-items:</p>
            <button id="btnAlignStart">flex-start</button>
            <button id="btnAlignCenter">center</button>
            <button id="btnAlignEnd">flex-end</button>
            <button id="btnStretch">stretch</button>

            <p>flex-wrap:</p>
            <button id="btnWrap">wrap</button>
            <button id="btnNowrap">nowrap</button>

            <p>gap: <input type="number" id="inputGap" min="0" max="100" value="0"></p>
        </div>

        <div id="dreapta">
            <div id="cardContainer"></div>
        </div>

    </div>

    <script src="src/script.js"></script>
</body>
</html>
